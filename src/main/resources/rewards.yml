          # 纹理值取自 Mojang 会话服务器：
          #   https://sessionserver.mojang.com/session/minecraft/profile/<UUID>?unsigned=false
          # 只有 skull-uuid / skull-owner 时，若该玩家从未在本服上线过，
          # 服务器缓存里没有皮肤数据，会发出一个默认皮肤的头。
