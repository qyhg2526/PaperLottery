# ==========================================================================
#  PaperLottery 奖励配置 —— 测试卡池
#  ------------------------------------------------------------------------
#  本文件只配置了 1 个卡池：id = test，显示名「测试卡池」
#    · 单抽      10000 金币
#    · 十连抽    99900 金币
#    · 货币      vault（Vault 主经济，需安装 Vault + 任意经济插件）
#
#  改完执行 /lottery reload 立即生效，无需重启。
#
#  ── 权重与概率 ──────────────────────────────────────────────────────────
#  weight 越大越容易抽中，概率 = 本奖品权重 ÷ 当前可用奖品权重之和。
#  下方每条注释里的百分比，是按「全部奖品均可用」算出的参考值（总权重 3176）。
#
#  分级概率：普通 44.40% | 优秀 24.45% | 稀有 19.87% | 史诗 6.52% | 传说 4.76%
# ==========================================================================

pools:
  test:
    display-name: "<gradient:#f9c74f:#f9844a><bold>测试卡池"
    icon: CHEST
    description:
      - "<gray>单抽 <white>10000 <gray>金币，十连 <white>99900 <gray>金币。"
      - "<gray>从腐肉到鞘翅，运气好还能抽到 <gold>传说<gray> 级大奖。"
    currency: vault
    cost:
      default: 10000
      10: 99900
    amounts: [1, 5, 10]
    permission: ""
    # ── 每日抽奖次数上限 ────────────────────────────────────────────────
    # 每名玩家每天在该卡池最多能抽多少次（按 config.yml 的
    # daily-draw-reset-zone 判定「每天」，默认跟随服务器时区）。
    # -1 或不写表示不限。拥有 paperlottery.limit.bypass 权限的玩家不受限制。
    daily-draw-limit: 200
    # 每次至少保证「优秀」以上，避免十连全是腐肉
    guarantee-rarity: uncommon
    # 连抽至少保证「稀有」以上
    ten-pull-rarity: rare
    # 抽到传说级时全服播报
    announce-rarities: [legendary]
    # 保底：20 抽没出稀有 -> 下一次必出稀有或更高
    #       150 抽没出传说 -> 下一次必出传说
    pity:
      - rarity: rare
        threshold: 50
        reset-on-hit: true
      - rarity: legendary
        threshold: 150
        reset-on-hit: true

