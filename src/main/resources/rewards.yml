          amount-min: 12
          amount-max: 24

      # ==================================================================
      #  优秀 uncommon —— 实用资源        合计 620 / 2587 = 23.97%
      # ==================================================================
      iron_ingot:                              # 12.27%
        display-name: "<green>铁锭"
        rarity: uncommon
