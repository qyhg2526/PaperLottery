name: PaperLottery
version: '${version}'
main: cn.dsh.lottery.PaperLotteryPlugin
api-version: '1.21'
authors: [DSH]
description: 基于 Paper Dialog API 的多货币抽奖插件（支持 Vault 经济系统）
website: https://docs.papermc.io/paper/dev/dialogs/
softdepend: [Vault]
folia-supported: false

commands:
  lottery:
    description: 抽奖插件主命令
    usage: /lottery help
    aliases: [lot, choujiang, cj, draw]

permissions:
  paperlottery.use:
    description: 允许打开抽奖界面并进行抽奖
    default: true
  paperlottery.draw:
    description: 允许执行抽奖
    default: true
  paperlottery.pool.*:
    description: 允许使用全部卡池
    default: true
    children:
      paperlottery.use: true
  paperlottery.admin:
    description: 管理员权限（重载、卡池与奖品管理）
    default: op
    children:
      paperlottery.use: true
      paperlottery.draw: true
