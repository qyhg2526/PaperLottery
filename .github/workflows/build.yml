name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 编译并校验插件
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # 仓库自带 lib/ 依赖与 ECJ 编译器，因此无需联网解析依赖。
      # 之所以不用 javac：Paper 26.2 的 paper-api jar 中同一方法带有两份
      # @NotNull 类型批注，javac 会报「无法将类型批注附加到…」，ECJ 可正常处理。
      - name: 编译打包
        shell: pwsh
        run: ./build.ps1

      - name: 校验产物
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $jar = Get-ChildItem build/libs/*.jar | Select-Object -First 1
          if (-not $jar) { throw '未生成 jar' }
          Write-Host "产物: $($jar.FullName) ($($jar.Length) 字节)"

          # 校验 plugin.yml 与打包进来的资源
          $tmp = Join-Path ([System.IO.Path]::GetTempPath()) 'pl-verify'
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          Push-Location $tmp
          jar xf $jar.FullName plugin.yml config.yml rewards.yml
          Pop-Location

          $plugin = Get-Content (Join-Path $tmp 'plugin.yml') -Raw
          if ($plugin -notmatch 'main:\s*cn\.dsh\.lottery\.PaperLotteryPlugin') {
            throw 'plugin.yml 缺少正确的 main 入口'
          }
          Write-Host '✓ plugin.yml 入口正确'
          foreach ($f in @('config.yml', 'rewards.yml')) {
            if (Test-Path (Join-Path $tmp $f)) { Write-Host "✓ $f 已打包" } else { throw "缺少 $f" }
          }

          # 校验关键类存在
          $classes = jar tf $jar.FullName
          foreach ($c in @(
              'cn/dsh/lottery/PaperLotteryPlugin.class',
              'cn/dsh/lottery/lottery/PityEngine.class',
              'cn/dsh/lottery/animation/AnimationRunner.class',
              'cn/dsh/lottery/ui/DialogManager.class')) {
            if ($classes -notcontains $c) { throw "缺少类: $c" }
          }
          $count = ($classes | Where-Object { $_ -like '*.class' }).Count
          Write-Host "✓ 关键类齐全，共 $count 个 class"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: PaperLottery
          path: build/libs/*.jar
          if-no-files-found: error

  # 打 v* 标签时自动创建 GitHub Release，并把编译好的 jar 附上去
  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: PaperLottery
          path: dist

      - name: 生成发布说明
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 标签形如 v1.0.1，去掉前缀得到版本号
          $version = '${{ github.ref_name }}'.TrimStart('v', 'V')
          Write-Host "版本: $version"
          Write-Host "产物:"
          Get-ChildItem dist -Recurse -File | ForEach-Object { "  $($_.Name) ($($_.Length) 字节)" }
          ./scripts/extract-changelog.ps1 -Version $version -Output release-notes.md
          Write-Host '--- 发布说明 ---'
          Get-Content release-notes.md -Encoding UTF8

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: PaperLottery ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/**/*.jar
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
